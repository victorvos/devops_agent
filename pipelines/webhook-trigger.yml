# ────────────────────────────────────────────────────────────────
# Azure Pipeline: DevOps Agent (Webhook / API Trigger)
# ────────────────────────────────────────────────────────────────
# Triggered via the Azure DevOps Pipelines REST API — no
# intermediary server needed. Just an authenticated POST:
#
#   POST https://dev.azure.com/{org}/{project}/_apis/pipelines/{id}/runs?api-version=7.1
#   Authorization: Basic {base64(:{PAT})}
#   Body: { "templateParameters": { "workItemId": "1234", ... } }
#
# Trigger sources that call this API:
#   1. Azure DevOps service hook → Power Automate / Logic App
#      parses @agent from work item comment → calls this API
#   2. MS Teams → Power Automate flow triggers on @agent mention
#      → extracts WI # → calls this API
#   3. CLI: `devops-agent trigger --work-item 1234 --pipeline-id 42`
#   4. Any script / tool with a PAT

trigger: none
pr: none

parameters:
  - name: workItemId
    displayName: "Work Item ID"
    type: number
  - name: requestType
    displayName: "Request type"
    type: string
    default: "investigation"
    values:
      - investigation
      - feature_request
      - bug
  - name: additionalContext
    displayName: "Context from the @agent mention"
    type: string
    default: ""
  - name: triggerSource
    displayName: "Where the trigger came from"
    type: string
    default: "api"
    values:
      - devops_mention
      - teams_mention
      - api
      - cli
  - name: reportOnly
    displayName: "Report only"
    type: boolean
    default: false

variables:
  - group: devops-agent-secrets

pool:
  vmImage: "ubuntu-latest"

container: python:3.12-slim

steps:
  - checkout: self
    fetchDepth: 1
    displayName: "Checkout agent code"

  - template: templates/python-setup.yml
    parameters:
      installDev: false

  - template: templates/run-agent.yml
    parameters:
      workItemId: ${{ parameters.workItemId }}
      requestType: ${{ parameters.requestType }}
      additionalContext: ${{ parameters.additionalContext }}
      reportOnly: ${{ parameters.reportOnly }}
      triggerSource: ${{ parameters.triggerSource }}

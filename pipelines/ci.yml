# ────────────────────────────────────────────────────────────────
# Azure Pipeline: CI (Lint + Test)
# ────────────────────────────────────────────────────────────────
# Runs on every push / PR to validate the agent codebase itself.

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

container: python:3.12-slim

steps:
  - checkout: self
    fetchDepth: 1
    displayName: "Checkout"

  - template: templates/python-setup.yml
    parameters:
      pythonVersion: "3.12"
      installDev: true

  # ── Lint ──────────────────────────────────────────────────
  - script: |
      uv run ruff check src/ tests/
      uv run ruff format --check src/ tests/
    displayName: "Lint (ruff)"

  # ── Type check ────────────────────────────────────────────
  - script: |
      uv run mypy src/ --ignore-missing-imports
    displayName: "Type check (mypy)"
    continueOnError: true

  # ── Tests ─────────────────────────────────────────────────
  - script: |
      uv run pytest tests/ -v --tb=short --junitxml=test-results.xml --cov=src --cov-report=xml
    displayName: "Test (pytest)"

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: "test-results.xml"
      testRunTitle: "DevOps Agent Tests"
    condition: always()
    displayName: "Publish test results"

  - task: PublishCodeCoverageResults@2
    inputs:
      codeCoverageTool: "Cobertura"
      summaryFileLocation: "coverage.xml"
    condition: always()
    displayName: "Publish coverage"

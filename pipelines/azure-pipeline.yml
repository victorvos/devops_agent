# ────────────────────────────────────────────────────────────────
# Azure Pipeline: DevOps Agent (Manual Trigger)
# ────────────────────────────────────────────────────────────────
# Run manually from the Azure DevOps UI or API with parameters.
# Uses reusable templates for Python/uv setup and agent execution.

trigger: none
pr: none

parameters:
  - name: workItemId
    displayName: "Work Item ID to investigate"
    type: number
  - name: requestType
    displayName: "Request type"
    type: string
    default: "investigation"
    values:
      - investigation
      - feature_request
      - bug
  - name: additionalContext
    displayName: "Additional context for the agent"
    type: string
    default: ""
  - name: reportOnly
    displayName: "Report only (no branch/PR)"
    type: boolean
    default: false

variables:
  - group: devops-agent-secrets

pool:
  vmImage: "ubuntu-latest"

container: python:3.12-slim

steps:
  # ── Checkout agent code (shallow) ─────────────────────────
  - checkout: self
    fetchDepth: 1
    displayName: "Checkout agent code"

  # ── Python + uv + ProGet setup ────────────────────────────
  - template: templates/python-setup.yml
    parameters:
      pythonVersion: "3.12"
      installDev: false

  # ── Run the agent ──────────────────────────────────────────
  - template: templates/run-agent.yml
    parameters:
      workItemId: ${{ parameters.workItemId }}
      requestType: ${{ parameters.requestType }}
      additionalContext: ${{ parameters.additionalContext }}
      reportOnly: ${{ parameters.reportOnly }}
      triggerSource: "manual"

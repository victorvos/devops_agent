# ────────────────────────────────────────────────────────────────
# Template: Python Setup with uv + ProGet + Cache
# ────────────────────────────────────────────────────────────────
# Reusable template that installs uv, restores cached venv/packages,
# configures ProGet, and syncs only when dependencies change.
#
# Caching strategy:
#   - The .venv/ and uv cache are persisted between pipeline runs
#     via Azure Pipelines Cache@2 task, keyed on uv.lock.
#   - If uv.lock hasn't changed → cache hit → uv sync is a no-op
#     (takes ~1-2s instead of 30-60s).
#   - If uv.lock changed → cache miss → full sync from ProGet,
#     then cache is saved for next run.
#
# Expects the pipeline to run inside a python:3.12-slim container.
#
# Usage:
#   container: python:3.12-slim
#   steps:
#     - template: templates/python-setup.yml
#       parameters:
#         installDev: true

parameters:
  - name: installDev
    type: boolean
    default: false

steps:
  # ── Install uv ──────────────────────────────────────────────
  - script: |
      pip install uv --quiet
      uv --version
    displayName: "Install uv via pip"

  # ── Restore cached venv + uv package cache ─────────────────
  # Keyed on uv.lock — only re-syncs when dependencies change.
  # On cache hit, uv sync becomes a near-instant no-op.
  - task: Cache@2
    inputs:
      key: 'uv-venv | "$(Agent.OS)" | uv.lock'
      restoreKeys: |
        uv-venv | "$(Agent.OS)"
      path: $(Build.SourcesDirectory)/.venv
    displayName: "Cache: .venv"

  - task: Cache@2
    inputs:
      key: 'uv-cache | "$(Agent.OS)" | uv.lock'
      restoreKeys: |
        uv-cache | "$(Agent.OS)"
      path: /tmp/uv-cache
    displayName: "Cache: uv package cache"

  # ── Sync dependencies ──────────────────────────────────────
  # --python-preference=only-system → uses the container's Python.
  # If the cache was restored and uv.lock matches, this is a no-op.
  - ${{ if eq(parameters.installDev, true) }}:
    - script: |
        uv sync --all-extras --python-preference=only-system
      displayName: "uv sync (with dev dependencies)"
      env:
        UV_CACHE_DIR: /tmp/uv-cache
        UV_HTTP_BASIC_PROGET_USERNAME: $(PROGET_USERNAME)
        UV_HTTP_BASIC_PROGET_PASSWORD: $(PROGET_API_KEY)
  - ${{ else }}:
    - script: |
        uv sync --no-dev --python-preference=only-system
      displayName: "uv sync (production only)"
      env:
        UV_CACHE_DIR: /tmp/uv-cache
        UV_HTTP_BASIC_PROGET_USERNAME: $(PROGET_USERNAME)
        UV_HTTP_BASIC_PROGET_PASSWORD: $(PROGET_API_KEY)

  # ── Verify installation ────────────────────────────────────
  - script: |
      uv run python --version
      echo "---"
      uv pip list --format=columns | head -20
    displayName: "Verify environment"

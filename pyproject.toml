[project]
name = "devops-agent"
version = "0.1.0"
description = "An intelligent Azure DevOps agent that uses targeted retrieval to handle feature requests and backlog investigations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "azure-devops>=7.1",
    "msrest>=0.7",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tiktoken>=0.7",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
devops-agent = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── uv configuration ────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

# ProGet as the package index — all packages are resolved from
# your organization's ProGet PyPI feed. Set the URL and credentials
# in the environment or .env file.
[[tool.uv.index]]
name = "proget"
url = "https://proget.your-org.com/pypi/python-packages/simple/"
default = true

# Optional: allow fallback to PyPI (remove this if ProGet mirrors everything)
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

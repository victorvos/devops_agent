name: Deploy Infra (Bicep) & LangGraph Container App (Keyless OIDC)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Target environment (dev, staging, prod)'
        required: true
        default: 'dev'

# Required for Entra Workload Identity Federation (OIDC token exchange without secrets)
permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-lgorchestrator-dev' }}
  WORKLOAD_NAME: 'lgorchestrator'
  ENVIRONMENT_NAME: ${{ inputs.environmentName || 'dev' }}

jobs:
  validate-and-test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m py_compile src/app/main.py src/app/auth/entra.py src/app/graph/orchestrator.py src/app/services/ado_client.py
          PYTHONPATH=src pytest -q

  deploy-bicep-and-container:
    name: Keyless OIDC Deploy to Azure Container Apps
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      # 100% Keyless Login via Workload Identity Federation (No client-secret!)
      - name: Azure Login via OIDC Federated Credential
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate & Deploy Bicep Infrastructure
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/enterprise.bicep
          parameters: ./infra/enterprise.bicepparam

      - name: Build & Push Image to ACR using Managed Identity / Entra Token
        run: |
          ACR_SERVER="${{ steps.bicep.outputs.acrLoginServer }}"
          ACR_NAME="${ACR_SERVER%%.*}"
          IMAGE_TAG="${ACR_SERVER}/${{ env.WORKLOAD_NAME }}:${{ github.sha }}"

          # Keyless ACR login via Azure CLI Entra token
          az acr login --name "$ACR_NAME"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Azure Container App Revision
        run: |
          CA_NAME="ca-${{ env.WORKLOAD_NAME }}-${{ env.ENVIRONMENT_NAME }}"
          az containerapp update \
            --name "$CA_NAME" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_TAG }}"
